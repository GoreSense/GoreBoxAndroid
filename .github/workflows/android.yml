name: Android APK

on:
  push:
    branches:
      - "arena/03ebb552-goreboxandroid"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sing-box core and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.10"
          cache: true
          cache-dependency-path: core/sing-box/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.2.11394342"

      - name: Build sing-box libbox.aar
        run: ./scripts/build-libbox-android.sh

      - name: Run Android unit tests and assemble APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoreBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
